<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Anime Face Matcher</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: monospace;
      background: #111;
      color: #fff;
      margin: 0;
      padding: 10px;
      height: 100vh;
      height: 100dvh; /* Dynamic viewport height for mobile browsers */
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden; /* Prevents vertical scrolling */
    }

    /* Loading Overlay */
    #loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #121318;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.2s ease-out;
      padding: 20px;
    }

    .loading-card {
      background: #1c1e2c;
      border: 1px solid #32374a;
      border-radius: 12px;
      padding: 25px;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .gif-container {
      width: 100%;
      height: 220px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #52b7b5;
      box-shadow: 0 0 15px rgba(82, 183, 183, 0.25);
      margin-bottom: 20px;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .gif-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: #2a2e40;
      border-radius: 3px;
      overflow: hidden;
      position: relative;
      margin-bottom: 15px;
    }

    .progress-bar {
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, #388e8c, #52b7b5);
      border-radius: 3px;
      position: absolute;
      animation: indeterminate 1.5s infinite ease-in-out;
    }

    @keyframes indeterminate {
      0% { left: -40%; }
      100% { left: 100%; }
    }

    .status-text {
      color: #b0b5c0;
      font-size: 0.9em;
      text-align: center;
      letter-spacing: 0.5px;
    }

    /* Header & Layout Structure */
    .main-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      height: 100%;
      max-width: 1200px;
      opacity: 0;
      transition: opacity 0.2s ease-in;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 5px 10px;
      margin-bottom: 5px;
    }

    h2 {
      margin: 0;
      font-size: 1.2rem;
    }

    /* Collapsible Settings Button & Drawer */
    .settings-btn {
      background: #222;
      border: 1px solid #444;
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-family: monospace;
      font-size: 0.85rem;
    }

    .settings-drawer {
      position: absolute;
      top: 45px;
      right: 10px;
      background: #1c1e2c;
      border: 1px solid #32374a;
      border-radius: 8px;
      padding: 15px;
      width: 280px;
      z-index: 100;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      display: none;
    }

    .settings-drawer.active {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    .slider-labels {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 0.75em;
      color: #aaa;
    }

    /* Responsive Viewport Grid */
    .container {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      gap: 15px;
      width: 100%;
      flex: 1;
      min-height: 0; /* Prevents flex overflow */
    }

    .box {
      position: relative;
      width: 100%;
      height: 100%;
      max-height: 80vh;
      border: 2px solid #333;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
    }

    #video, #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform: scaleX(-1);
    }

    #match-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Vertical Mobile Viewport Overrides (<768px) */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        gap: 10px;
      }

      .box {
        max-height: 42vh; /* Splitting vertical screen height safely */
      }
    }
  </style>
</head>
<body>

  <div id="loading-overlay">
    <div class="loading-card">
      <div class="gif-container">
        <img src="loading.gif" alt="Loading...">
      </div>
      <div class="progress-track">
        <div class="progress-bar"></div>
      </div>
      <div id="status-text" class="status-text">Connecting to server...</div>
    </div>
  </div>

  <div id="main-content" class="main-content">
    <div class="header-bar">
      <h2>Face Matcher</h2>
      <button id="settingsBtn" class="settings-btn">⚙️ Focus</button>
      
      <div id="settingsDrawer" class="settings-drawer">
        <div class="control-group">
          <label for="alphaSlider" style="text-align: center; font-size: 0.85rem;">
            Match Weight:<br><span id="alphaVal">Expr (30%) / Spatial (70%)</span>
          </label>
          <input type="range" id="alphaSlider" min="0" max="1" step="0.01" value="0.3" style="width: 100%;">
          <div class="slider-labels">
            <span>Spatial</span>
            <span>Expression</span>
          </div>
        </div>
      </div>
    </div>

    <div class="container">
      <div class="box">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
      </div>
      <div class="box">
        <img id="match-img" src="" alt="Waiting for match...">
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const matchImg = document.getElementById('match-img');
    const alphaSlider = document.getElementById('alphaSlider');
    const alphaVal = document.getElementById('alphaVal');
    const loadingOverlay = document.getElementById('loading-overlay');
    const mainContent = document.getElementById('main-content');
    const statusText = document.getElementById('status-text');
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsDrawer = document.getElementById('settingsDrawer');

    // Toggle Settings Drawer
    settingsBtn.onclick = (e) => {
      e.stopPropagation();
      settingsDrawer.classList.toggle('active');
    };

    document.onclick = (e) => {
      if (!settingsDrawer.contains(e.target) && e.target !== settingsBtn) {
        settingsDrawer.classList.remove('active');
      }
    };

    alphaSlider.oninput = () => {
      const exprPct = Math.round(alphaSlider.value * 100);
      const spatialPct = 100 - exprPct;
      alphaVal.innerText = `Expr (${exprPct}%) / Spatial (${spatialPct}%)`;
    };

    const RENDER_BACKEND_URL = "avemygo-face-matcher-docker.onrender.com";

    const isLocal = location.hostname === "localhost" || location.hostname === "127.0.0.1";
    const wsProtocol = (location.protocol === "https:" || !isLocal) ? "wss:" : "ws:";
    const wsHost = isLocal ? location.host : RENDER_BACKEND_URL;
    // Absolute origin of the Render backend, for loading matched images served
    // as static files on Render (the page itself may be served from GitHub Pages).
    // Use https:, NOT wss: — images are loaded via HTTP, not the websocket.
    const backendOrigin = isLocal ? "" : `https://${wsHost}`;

    // Correct URL structure without duplicate protocols or slashes
    const ws = new WebSocket(`${wsProtocol}//${wsHost}/ws`);

    ws.onopen = () => {
      console.log("WebSocket connection established!");
    };

    ws.onerror = (err) => {
      console.error("WebSocket connection failed:", err);
    };

    let isProcessing = false;
    let currentLandmarks = null;

    // Mobile-optimized media constraints
    navigator.mediaDevices.getUserMedia({ 
      video: { 
        width: { ideal: 640 }, 
        height: { ideal: 480 },
        facingMode: 'user'
      } 
    }).then(stream => {
      video.srcObject = stream;
      return new Promise((resolve, reject) => {
        if (video.readyState >= 1) {
          resolve();
        } else {
          video.onloadedmetadata = resolve;
          video.onerror = reject;
        }
      });
    }).then(() => {
      const w = video.videoWidth || 640;
      const h = video.videoHeight || 480;
      canvas.width = w;
      canvas.height = h;
      video.play().catch(() => {});
      requestAnimationFrame(renderLoop);
      sendFrame();
    }).catch(err => {
      statusText.innerText = 'Camera error: ' + (err && err.name ? err.name : err);
      console.error('getUserMedia error:', err);
    });

    function sendFrame() {
      if (ws.readyState === WebSocket.OPEN && !isProcessing) {
        isProcessing = true;

        const offscreen = document.createElement('canvas');
        offscreen.width = canvas.width;
        offscreen.height = canvas.height;
        const offCtx = offscreen.getContext('2d');

        offCtx.translate(offscreen.width, 0);
        offCtx.scale(-1, 1);
        offCtx.drawImage(video, 0, 0, offscreen.width, offscreen.height);

        const dataUrl = offscreen.toDataURL('image/jpeg', 0.5);

        if (typeof dataUrl !== 'string' || dataUrl.indexOf('data:image') !== 0) {
          isProcessing = false;
          setTimeout(sendFrame, 100);
          return;
        }

        const payload = JSON.stringify({
          image: dataUrl,
          alpha: parseFloat(alphaSlider.value)
        });

        ws.send(payload);
      }
    }

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);

      if (data.status === 'loading') {
        statusText.innerText = 'Initializing face database on backend...';
        isProcessing = false;
        setTimeout(sendFrame, 200);
        return;
      }

      if (loadingOverlay.style.display !== 'none') {
        loadingOverlay.style.display = 'none';
        mainContent.style.opacity = '1';
      }

      if (data.landmarks) {
        currentLandmarks = data.landmarks.map(pt => ({
          x: 1 - pt.x,
          y: pt.y
        }));
      } else {
        currentLandmarks = null;
      }

      if (data.matched_image_url) {
        matchImg.src = backendOrigin + data.matched_image_url;
      }

      isProcessing = false;
      setTimeout(sendFrame, 16);
    };

    function renderLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (currentLandmarks) {
        ctx.fillStyle = '#00FF00';
        currentLandmarks.forEach(pt => {
          ctx.beginPath();
          ctx.arc(pt.x * canvas.width, pt.y * canvas.height, 3, 0, 2 * Math.PI);
          ctx.fill();
        });
      }

      requestAnimationFrame(renderLoop);
    }
  </script>
</body>
</html>
