<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Anime Face Matcher</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <style>
    body {
      font-family: monospace;
      background: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 20px;
    }

    #loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #121318;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.2s ease-out;
    }

    .loading-card {
      background: #1c1e2c;
      border: 1px solid #32374a;
      border-radius: 12px;
      padding: 30px;
      width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .gif-container {
      width: 100%;
      height: 220px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #52b7b5;
      box-shadow: 0 0 15px rgba(82, 183, 183, 0.25);
      margin-bottom: 20px;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .gif-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: #2a2e40;
      border-radius: 3px;
      overflow: hidden;
      position: relative;
      margin-bottom: 15px;
    }

    .progress-bar {
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, #388e8c, #52b7b5);
      border-radius: 3px;
      position: absolute;
      animation: indeterminate 1.5s infinite ease-in-out;
    }

    @keyframes indeterminate {
      0% { left: -40%; }
      100% { left: 100%; }
    }

    .status-text {
      color: #b0b5c0;
      font-size: 0.9em;
      text-align: center;
      letter-spacing: 0.5px;
    }

    /* Main UI elements hidden during loading phase */
    .main-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transition: opacity 0.2s ease-in;
    }

    .controls {
      display: flex;
      gap: 30px;
      margin-bottom: 20px;
      background: #222;
      padding: 15px 25px;
      border-radius: 8px;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      width: 300px;
    }
    .slider-labels {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 0.8em;
      color: #aaa;
    }
    .container {
      display: flex;
      gap: 20px;
    }
    .box {
      position: relative;
      width: 640px;
      height: 480px;
      border: 2px solid #333;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #video, #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
    }
    #match-img {
      width: 100%;
      height: auto;
      max-height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <div id="loading-overlay">
    <div class="loading-card">
      <div class="gif-container">
        <img src="/static/loading.gif" alt="Loading...">
      </div>
      <div class="progress-track">
        <div class="progress-bar"></div>
      </div>
      <div id="status-text" class="status-text">Connecting to server...</div>
    </div>
  </div>

  <div id="main-content" class="main-content">
    <h2>Anime Face Matcher</h2>

    <div class="controls">
      <div class="control-group">
        <label for="alphaSlider">Match Focus: <span id="alphaVal">Expression (30%) / Spatial (70%)</span></label>
        <input type="range" id="alphaSlider" min="0" max="1" step="0.01" value="0.3" style="width: 100%;">
        <div class="slider-labels">
          <span>Spatial Heavy</span>
          <span>Expression Heavy</span>
        </div>
      </div>
    </div>

    <div class="container">
      <div class="box">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
      </div>
      <div class="box">
        <img id="match-img" src="" alt="Waiting for match...">
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const matchImg = document.getElementById('match-img');
    const alphaSlider = document.getElementById('alphaSlider');
    const alphaVal = document.getElementById('alphaVal');
    const loadingOverlay = document.getElementById('loading-overlay');
    const mainContent = document.getElementById('main-content');
    const statusText = document.getElementById('status-text');

    alphaSlider.oninput = () => {
      const exprPct = Math.round(alphaSlider.value * 100);
      const spatialPct = 100 - exprPct;
      alphaVal.innerText = `Expression (${exprPct}%) / Spatial (${spatialPct}%)`;
    };

    const ws = new WebSocket(`ws://${location.host}/ws`);

    let isProcessing = false;
    let currentLandmarks = null;

    navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } }).then(stream => {
      video.srcObject = stream;
      video.onloadedmetadata = () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        requestAnimationFrame(renderLoop);
        sendFrame();
      };
    });

    function sendFrame() {
      if (ws.readyState === WebSocket.OPEN && !isProcessing) {
        isProcessing = true;

        const offscreen = document.createElement('canvas');
        offscreen.width = canvas.width;
        offscreen.height = canvas.height;
        const offCtx = offscreen.getContext('2d');

        offCtx.translate(offscreen.width, 0);
        offCtx.scale(-1, 1);
        offCtx.drawImage(video, 0, 0, offscreen.width, offscreen.height);

        const dataUrl = offscreen.toDataURL('image/jpeg', 0.5);

        const payload = JSON.stringify({
          image: dataUrl,
          alpha: parseFloat(alphaSlider.value)
        });

        ws.send(payload);
      }
    }

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);

      if (data.status === 'loading') {
        statusText.innerText = 'Initializing face database on backend...';
        isProcessing = false;
        setTimeout(sendFrame, 200);
        return;
      }

      // Hide loading overlay and reveal main UI cleanly
      if (loadingOverlay.style.display !== 'none') {
        loadingOverlay.style.display = 'none';
        mainContent.style.opacity = '1';
      }

      if (data.landmarks) {
        currentLandmarks = data.landmarks.map(pt => ({
          x: 1 - pt.x,
          y: pt.y
        }));
      } else {
        currentLandmarks = null;
      }

      if (data.matched_image) {
        matchImg.src = 'data:image/jpeg;base64,' + data.matched_image;
      }

      isProcessing = false;
      setTimeout(sendFrame, 16);
    };

    function renderLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (currentLandmarks) {
        ctx.fillStyle = '#00FF00';
        currentLandmarks.forEach(pt => {
          ctx.beginPath();
          ctx.arc(pt.x * canvas.width, pt.y * canvas.height, 3, 0, 2 * Math.PI);
          ctx.fill();
        });
      }

      requestAnimationFrame(renderLoop);
    }
  </script>
</body>
</html>
